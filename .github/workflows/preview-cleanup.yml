name: Cleanup Preview Branch

on:
  pull_request:
    types: [closed]
  delete:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  cleanup-closed-pr:
    name: Cleanup Neon branch for closed PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete Neon preview branch
        env:
          BRANCH_NAME: preview/pr-${{ github.event.pull_request.number }}
        run: .github/scripts/neon-preview-cleanup.sh delete-preview-branch

  cleanup-deleted-git-branch:
    name: Cleanup Neon branch for deleted Git branch
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find PRs for deleted branch
        id: prs
        run: |
          DELETED_BRANCH="${{ github.event.ref }}"
          HEAD_QUERY="${{ github.repository_owner }}:${DELETED_BRANCH}"
          ENCODED_HEAD=$(printf '%s' "$HEAD_QUERY" | jq -sRr @uri)
          PR_NUMBERS=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?head=${ENCODED_HEAD}&state=all&per_page=100" \
            | jq -r '.[].number')

          {
            echo "numbers<<EOF"
            echo "$PR_NUMBERS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Delete Neon preview branches
        if: steps.prs.outputs.numbers != ''
        run: |
          while IFS= read -r PR_NUMBER; do
            [ -n "$PR_NUMBER" ] || continue
            export BRANCH_NAME="preview/pr-${PR_NUMBER}"
            if .github/scripts/neon-preview-cleanup.sh delete-preview-branch; then
              echo "Deleted ${BRANCH_NAME} for deleted Git branch ${{ github.event.ref }}"
            else
              echo "Failed to delete ${BRANCH_NAME} for deleted Git branch ${{ github.event.ref }}" >&2
              exit 1
            fi
          done <<< "${{ steps.prs.outputs.numbers }}"

      - name: Report no linked PRs
        if: steps.prs.outputs.numbers == ''
        run: echo "No PRs found for deleted Git branch ${{ github.event.ref }}"

  reconcile-preview-branches:
    name: Reconcile orphaned Neon preview branches
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete Neon preview branches without open PRs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .github/scripts/neon-preview-cleanup.sh reconcile-preview-branches
