name: Preview Migrations

on:
  deployment_status:

jobs:
  migrate:
    name: Run migrations on Neon preview branch
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Get PR number
        id: pr
        run: |
          # Vercel sets deployment.ref to the commit SHA, not the branch name,
          # so look up the open PR by the deployed commit instead.
          SHA="${{ github.event.deployment.sha }}"
          PR_NUMBER=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${SHA}/pulls" \
            | jq -r '[.[] | select(.state == "open")][0].number')
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open PR found for commit ${SHA}, skipping migrations"
            exit 0
          fi
          echo "number=${PR_NUMBER}" >> $GITHUB_OUTPUT

      - name: Get or create Neon preview branch
        id: neon
        if: steps.pr.outputs.number
        run: |
          BRANCH_NAME="preview/pr-${{ steps.pr.outputs.number }}"

          # Check if branch already exists
          BRANCHES=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" \
            "https://console.neon.tech/api/v2/projects/${{ secrets.NEON_PROJECT_ID }}/branches")
          if ! echo "$BRANCHES" | jq -e '.branches' > /dev/null; then
            echo "Failed to list Neon branches: $(echo "$BRANCHES" | jq -r '.message // .')"
            exit 1
          fi
          BRANCH_ID=$(echo "$BRANCHES" | jq -r --arg name "$BRANCH_NAME" '.branches[] | select(.name == $name) | .id')

          # Create branch if it doesn't exist
          if [ -z "$BRANCH_ID" ] || [ "$BRANCH_ID" = "null" ]; then
            echo "Creating Neon branch ${BRANCH_NAME}..."
            CREATE_RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" \
              -H "Content-Type: application/json" \
              "https://console.neon.tech/api/v2/projects/${{ secrets.NEON_PROJECT_ID }}/branches" \
              -d "{\"branch\": {\"name\": \"${BRANCH_NAME}\"}}")
            BRANCH_ID=$(echo "$CREATE_RESPONSE" | jq -r '.branch.id')
            if [ -z "$BRANCH_ID" ] || [ "$BRANCH_ID" = "null" ]; then
              echo "Failed to create Neon branch: $CREATE_RESPONSE"
              exit 1
            fi
            echo "Created branch ${BRANCH_NAME} with ID ${BRANCH_ID}"
          fi

          CONNECTION=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" \
            "https://console.neon.tech/api/v2/projects/${{ secrets.NEON_PROJECT_ID }}/connection_uri?branch_id=${BRANCH_ID}&database_name=neondb&role_name=neondb_owner&pooled=true")
          POSTGRES_URL=$(echo "$CONNECTION" | jq -r '.uri // empty')
          if [ -z "$POSTGRES_URL" ]; then
            echo "Failed to get Neon connection URI: $(echo "$CONNECTION" | jq -r '.message // .')"
            exit 1
          fi
          echo "::add-mask::${POSTGRES_URL}"
          echo "postgres_url=${POSTGRES_URL}" >> $GITHUB_OUTPUT

      - name: Run migrations
        if: steps.pr.outputs.number
        env:
          POSTGRES_URL: ${{ steps.neon.outputs.postgres_url }}
        run: npm run db:migrate
